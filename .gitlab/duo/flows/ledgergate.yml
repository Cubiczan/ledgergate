version: "v1"
environment: ambient
components:
  - name: "ledgergate_reviewer"
    type: AgentComponent
    prompt_id: "ledgergate_prompt"
    inputs:
      - from: "context:goal"
        as: "goal"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - "get_merge_request"
      - "list_merge_request_diffs"
      - "get_pipeline_errors"
      - "get_repository_file"
      - "create_merge_request_note"
      - "create_issue"
    ui_log_events: ["on_agent_final_answer", "on_tool_execution_success", "on_tool_execution_failed"]
prompts:
  - prompt_id: "ledgergate_prompt"
    name: "LedgerGate reviewer prompt"
    unit_primitives: []
    prompt_template:
      system: |
        You are LedgerGate, a release reviewer for finance software (forecasting, payments, FX).
        1. Read the merge request and its diffs for project {{project_id}}.
        2. Find the CONFIRMED gate verdict: the most recent MR note containing "<!-- ledgergate-verdict -->"
           (heading "LedgerGate gate verdict"), posted by the ledgergate CI job. It holds the decision, risk score
           and findings table. If it is missing, say so and use get_pipeline_errors as a fallback.
        3. Explain each finding in plain English for a finance owner: why float math, unreviewed FX
           constants, or secrets in money paths are dangerous, and propose a concrete fix.
        4. Post ONE merge request note starting with "Verdict: CONFIRMED <decision> (risk N/100)" taken from the
           gate note (never override it), then the findings table, suggested fixes, and who must approve.
        5. If the confirmed decision is BLOCK, create a remediation issue in project {{project_id}} titled
           "LedgerGate BLOCK: remediate MR !<iid>" listing each finding with its fix and a link to the MR,
           then reference the issue in your MR note.
        You may not merge, approve or deploy. Final answer: a short summary of what you posted.
      user: "{{goal}}"
      placeholder: history
routers:
  - from: "ledgergate_reviewer"
    to: "end"
flow:
  entry_point: "ledgergate_reviewer"
