stages: [test, secure, gate, deploy]
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
variables: { LEDGERGATE_AUTONOMY: "supervised", LEDGERGATE_URL: "https://ledgergate-nu.vercel.app" }
unit:
  stage: test
  image: python:3.12-slim
  script: [pip install -q pytest, python -m pytest -q --junitxml=junit.xml]
  artifacts: { reports: { junit: junit.xml }, when: always }
ledgergate:
  stage: gate
  image: python:3.12-slim
  rules: [{ if: $CI_MERGE_REQUEST_IID }]
  script:
    - git fetch -q origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - git diff origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD > mr.diff
    - python -m ledgergate.gate mr.diff --autonomy $LEDGERGATE_AUTONOMY $( [ -f gl-sast-report.json ] && echo --sast gl-sast-report.json )
  artifacts: { paths: [ledgergate-report.md], when: always }
deploy_staging:
  stage: deploy
  image: curlimages/curl:8.10.1
  rules: [{ if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH }]
  environment: { name: staging, url: $LEDGERGATE_URL }
  script:
    - 'curl -fsS -X POST "$LEDGERGATE_URL/api/verdict" -H "Content-Type: application/json" -d "{\"diff\":\"+++ b/README.md\\n+docs\\n\"}" | tee smoke.json'
    - grep -q PROMOTE_STAGING smoke.json
deploy_production:
  stage: deploy
  image: curlimages/curl:8.10.1
  rules: [{ if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH, when: manual }]
  environment: { name: production, url: $LEDGERGATE_URL }
  script:
    - echo "Production is the Vercel deployment at $LEDGERGATE_URL (promoted after LedgerGate + human approval)"
    - curl -fsS "$LEDGERGATE_URL/api/verdict" | grep -q '"status": "ok"'
    - curl -fsS -o /dev/null "$LEDGERGATE_URL/"
